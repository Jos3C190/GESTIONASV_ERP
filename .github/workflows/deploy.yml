name: Deploy Automático a AWS EC2

on:
  push:
    branches:
      - develop
      - feature/ai-bedrock-guardrails
  workflow_dispatch:

concurrency:
  group: deploy-aws-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y ejecutar despliegue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/GESTIONASV_ERP
            BRANCH="${{ github.ref_name }}"
            echo ">>> Desplegando rama: $BRANCH"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            export DEPLOY_BRANCH="$BRANCH"
            bash /home/ec2-user/GESTIONASV_ERP/scripts/deploy.sh

