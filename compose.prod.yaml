# ERP System — Production-ish compose overlay.
# Usage: docker compose -f compose.yaml -f compose.prod.yaml --profile prod up -d --build
#
# This profile builds optimized images, drops dev tooling, runs as non-root,
# and assumes TLS is terminated upstream (e.g. Nginx). It is NOT a complete
# production setup — it is a sane hardened starting point for the boilerplate.
# Further hardening (secrets manager, external Postgres, S3, etc.) is expected
# at deploy time and is explicitly out of scope for the phase-0 boilerplate.

services:
  rustfs-permissions:
    profiles: [local-document-storage]

  rustfs:
    profiles: [local-document-storage]

  clamav:
    profiles: [local-document-storage]

  storage-init:
    profiles: [local-document-storage]

  redis:
    profiles: [local-document-processing]

  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    # In production do not expose 5432 to the host.
    ports: !reset []

  backend:
    build:
      target: prod
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: WARNING
      SECURE_COOKIES: "true"
      OBJECT_STORAGE_ENABLED: "false"
      REDIS_ENABLED: "false"
      OCR_ENABLED: "false"
      VLM_ENABLED: "false"
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-false}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      OBSERVABILITY_HEALTH_URL: ${OBSERVABILITY_HEALTH_URL:-}
      # Ningún GPS instalado hasta abrir su puerto en `traccar` (docs/gps-produccion.md).
      TRACCAR_TRACKER_MODELS: ${TRACCAR_TRACKER_MODELS:-none}
    depends_on: !override
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports: !reset []
    # Let Nginx (or your reverse proxy) expose 8000.
    expose:
      - "8000"

  migrate:
    build:
      target: prod

  document-maintenance:
    profiles: [local-document-storage]
    depends_on: !override
      backend:
        condition: service_healthy
      clamav:
        condition: service_healthy

  ocr-worker:
    profiles: [local-document-processing]
    depends_on: !override
      redis:
        condition: service_healthy

  loki:
    profiles: [local-observability]

  tempo:
    profiles: [local-observability]

  otel-collector:
    profiles: [local-observability]

  otel-queue-permissions:
    profiles: [local-observability]

  alertmanager:
    profiles: [local-observability]

  prometheus:
    profiles: [local-observability]

  grafana:
    profiles: [local-observability]

  seed:
    build:
      target: prod
    environment:
      AUTO_SEED: "false"

  frontend:
    build:
      target: prod
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        PUBLIC_CARTO_BASEMAP_API_KEY: ${PUBLIC_CARTO_BASEMAP_API_KEY:-}
    environment:
      ORIGIN: ${PUBLIC_ORIGIN:-https://localhost}
      BODY_SIZE_LIMIT: "1500000"
    restart: unless-stopped
    ports: !reset []
    expose:
      - "3000"

  # Servidor GPS (se activa con --profile tracking). Los teléfonos entran por Nginx con
  # HTTPS; la interfaz web y el puerto de la app no se exponen. Abre solo el puerto de los
  # modelos que uses y nómbralos en TRACCAR_TRACKER_MODELS (docs/gps-produccion.md).
  traccar:
    restart: unless-stopped
    ports: !override []
    #  - "5023:5023"  # gt06: Concox / Jimi
    #  - "5027:5027"  # teltonika
    #  - "5001:5001"  # gps103: Coban TK103-2B, GPS-103
    #  - "5002:5002"  # tk103: Coban TK103A, TK103B
    #  - "5004:5004"  # queclink
    #  - "5013:5013"  # sinotrack

  # Minimal reverse proxy. Configure certs/headers for your domain at deploy time.
  nginx:
    profiles: [prod]
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
