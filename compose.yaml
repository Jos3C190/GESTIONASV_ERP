# =============================================================
# ERP System — docker compose (development base)
# Local development stack with durable document processing.
# =============================================================

x-redis-ocr-environment: &redis-ocr-environment
  REDIS_ENABLED: "true"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
  REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-0.2}
  OCR_ENABLED: "true"
  OCR_LANGUAGES: ${OCR_LANGUAGES:-spa+eng}
  OCR_JOB_TIMEOUT_SECONDS: ${OCR_JOB_TIMEOUT_SECONDS:-900}
  OCR_TESSERACT_TIMEOUT_SECONDS: ${OCR_TESSERACT_TIMEOUT_SECONDS:-120}
  OCR_MAX_PAGES: ${OCR_MAX_PAGES:-300}
  OCR_MAX_OUTPUT_BYTES: ${OCR_MAX_OUTPUT_BYTES:-104857600}
  OCR_SKIP_BIG_MPIX: ${OCR_SKIP_BIG_MPIX:-50}
  OCR_MAX_ATTEMPTS: ${OCR_MAX_ATTEMPTS:-3}
  OCR_STALE_MINUTES: ${OCR_STALE_MINUTES:-20}
  OCR_RECONCILE_SECONDS: ${OCR_RECONCILE_SECONDS:-15}

x-observability-environment: &observability-environment
  OBSERVABILITY_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_EXPORTER_OTLP_TIMEOUT_SECONDS: ${OTEL_EXPORTER_OTLP_TIMEOUT_SECONDS:-3}
  OTEL_METRIC_EXPORT_INTERVAL_SECONDS: ${OTEL_METRIC_EXPORT_INTERVAL_SECONDS:-15}
  OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-erp}
  OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1.0}
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OBSERVABILITY_HEALTH_URL: http://otel-collector:13133/
  OBSERVABILITY_HEALTH_TIMEOUT_SECONDS: ${OBSERVABILITY_HEALTH_TIMEOUT_SECONDS:-0.5}

services:
  # ---------------- Postgres ----------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production_please}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_admin} -d ${POSTGRES_DB:-erp_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------------- Redis: ARQ queue + distributed rate limiting ----------------
  redis:
    image: redis:7.4.5-alpine
    command:
      - sh
      - -ec
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # ---------------- Local document object storage ----------------
  rustfs-permissions:
    image: alpine:3.22
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data /logs"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.4
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["/data"]
    env_file:
      - ./object-storage/rustfs.env
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      RUSTFS_OBS_ENDPOINT: http://otel-collector:4318
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "true"
      RUSTFS_OBS_METRICS_EXPORT_ENABLED: "true"
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "true"
      RUSTFS_OBS_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1.0}
      RUSTFS_OBS_METER_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL_SECONDS:-15}
      RUSTFS_OBS_SERVICE_NAME: rustfs
      RUSTFS_OBS_ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    env_file:
      - ./antivirus/clamav.env
    volumes:
      - clamav-db:/var/lib/clamav
    expose:
      - "3310"
    restart: unless-stopped

  storage-init:
    build:
      context: ./backend
      target: dev
    command: ["python", "-m", "app.infrastructure.storage_bootstrap"]
    environment: &document-storage-environment
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_INTERNAL_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-erp-documents}
      OBJECT_STORAGE_CORS_ORIGINS: ${OBJECT_STORAGE_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_UPLOAD_TTL_SECONDS: ${OBJECT_STORAGE_UPLOAD_TTL_SECONDS:-600}
      OBJECT_STORAGE_DOWNLOAD_TTL_SECONDS: ${OBJECT_STORAGE_DOWNLOAD_TTL_SECONDS:-300}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-52428800}
      DOCUMENT_MAX_PENDING_PER_USER: ${DOCUMENT_MAX_PENDING_PER_USER:-20}
      DOCUMENT_PENDING_RETENTION_HOURS: ${DOCUMENT_PENDING_RETENTION_HOURS:-24}
      DOCUMENT_QUARANTINE_RETENTION_DAYS: ${DOCUMENT_QUARANTINE_RETENTION_DAYS:-7}
      DOCUMENT_DELETION_RETENTION_DAYS: ${DOCUMENT_DELETION_RETENTION_DAYS:-30}
      DOCUMENT_SCAN_STALE_MINUTES: ${DOCUMENT_SCAN_STALE_MINUTES:-15}
      DOCUMENT_MAINTENANCE_INTERVAL_SECONDS: ${DOCUMENT_MAINTENANCE_INTERVAL_SECONDS:-3600}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-120}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: ./backend
      target: dev
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-cache:/root/.cache/uv
    restart: "no"

  # ---------------- Backend (FastAPI) ----------------
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # In development, migrations are an explicit operator/test step. This
      # prevents a hot-reload from applying a draft revision to live data.
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SUPPLIER_DATA_ENCRYPTION_KEY: ${SUPPLIER_DATA_ENCRYPTION_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
      REFRESH_RATE_LIMIT: ${REFRESH_RATE_LIMIT:-30/minute}
      RESET_RATE_LIMIT: ${RESET_RATE_LIMIT:-5/minute}
      # Local development runs over http://localhost, so Secure cookies would
      # never be sent and refresh-token rotation would fail after 15 minutes.
      # Production overrides this to true in compose.prod.yaml.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-erp-system}
      MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES:-10485760}
      MEDIA_SIGNATURE_TTL_SECONDS: ${MEDIA_SIGNATURE_TTL_SECONDS:-300}
      <<: [*document-storage-environment, *redis-ocr-environment, *observability-environment]
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-cache:/root/.cache/uv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ---------------- Asynchronous searchable-PDF worker ----------------
  ocr-worker:
    build:
      context: ./backend
      target: ocr
    environment:
      <<: [*document-storage-environment, *redis-ocr-environment, *observability-environment]
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    mem_limit: 2g
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test: ["CMD", "uv", "run", "arq", "app.infrastructure.ocr_worker.WorkerSettings", "--check"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  document-maintenance:
    build:
      context: ./backend
      target: dev
    command: ["python", "-m", "app.infrastructure.document_maintenance"]
    environment:
      <<: [*document-storage-environment, *redis-ocr-environment, *observability-environment]
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-cache:/root/.cache/uv
    restart: unless-stopped

  # ---------------- One-shot database bootstrap ----------------
  # Runs after Alembic finishes. A durable app_meta marker makes ordinary
  # restarts no-ops, preserving records intentionally sent to the trash.
  seed:
    build:
      context: ./backend
      target: dev
    command:
      - sh
      - -c
      - >-
        if [ "$$AUTO_SEED" = "true" ]; then
          python -m seed.seed_data;
        else
          echo "[seed] Automatic seed disabled.";
        fi
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      AUTO_SEED: ${AUTO_SEED:-true}
      FORCE_SEED: ${FORCE_SEED:-false}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@erp-system.dev}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-cache:/root/.cache/uv
    restart: "no"

  # ---------------- Frontend (SvelteKit dev) ----------------
  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        PUBLIC_GOOGLE_MAPS_API_KEY: ${PUBLIC_GOOGLE_MAPS_API_KEY:-}
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      PUBLIC_APP_NAME: ${PUBLIC_APP_NAME:-ERP System}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      PUBLIC_GOOGLE_MAPS_API_KEY: ${PUBLIC_GOOGLE_MAPS_API_KEY:-}
      ORIGIN: http://localhost:5173
    depends_on:
      backend:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    restart: unless-stopped

  # ---------------- Local observability (OpenTelemetry + Grafana) ----------------
  loki:
    image: grafana/loki:3.7.4
    command: ["-config.file=/etc/loki/loki.yaml"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    expose: ["3100"]
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-verify-config", "-config.file=/etc/loki/loki.yaml"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    expose: ["3200", "4317", "4318"]
    healthcheck:
      test: ["CMD", "/tempo", "-config.file=/etc/tempo/tempo.yaml", "-config.verify=true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  otel-queue-permissions:
    image: alpine:3.22
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /storage"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    volumes:
      - otel-queue-data:/storage
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - otel-queue-data:/var/lib/otelcol/storage
    expose: ["4318", "8888", "8889", "13133"]
    depends_on:
      otel-queue-permissions:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 10s
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.32.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  # ---------------- Security Scanners (optional, profile: security) ----------------
  security-zap:
    profiles: [security]
    image: ghcr.io/zaproxy/zaproxy:stable
    command: zap-baseline.py -t http://backend:8000 -J security-report.json -r security-report.html -I
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./reports:/zap/wrk/:rw

  security-trivy:
    profiles: [security, security-deep]
    image: aquasec/trivy:latest
    command: fs --format json --output /reports/trivy-report.json /src
    volumes:
      - .:/src:ro
      - ./reports:/reports:rw

  security-zap-deep:
    profiles: [security-deep]
    image: ghcr.io/zaproxy/zaproxy:stable
    command: zap-api-scan.py -t http://backend:8000/openapi.json -f openapi -J security-deep-report.json -r security-deep-report.html
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./reports:/zap/wrk/:rw

volumes:
  pgdata:
  rustfs-data:
  rustfs-logs:
  clamav-db:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alertmanager-data:
  otel-queue-data:
  backend-cache:
  frontend-node-modules:
