# =============================================================
# ERP System — docker compose (development base)
# Phase 0: db + backend + frontend with hot reload + healthchecks.
# =============================================================

services:
  # ---------------- Postgres ----------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production_please}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_admin} -d ${POSTGRES_DB:-erp_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------------- Local document object storage ----------------
  rustfs-permissions:
    image: alpine:3.22
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data /logs"]
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.4
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["/data"]
    env_file:
      - ./object-storage/rustfs.env
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    env_file:
      - ./antivirus/clamav.env
    volumes:
      - clamav-db:/var/lib/clamav
    expose:
      - "3310"
    restart: unless-stopped

  storage-init:
    build:
      context: ./backend
      target: dev
    command: ["python", "-m", "app.infrastructure.storage_bootstrap"]
    environment: &document-storage-environment
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_INTERNAL_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-erp-documents}
      OBJECT_STORAGE_CORS_ORIGINS: ${OBJECT_STORAGE_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_UPLOAD_TTL_SECONDS: ${OBJECT_STORAGE_UPLOAD_TTL_SECONDS:-600}
      OBJECT_STORAGE_DOWNLOAD_TTL_SECONDS: ${OBJECT_STORAGE_DOWNLOAD_TTL_SECONDS:-300}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-52428800}
      DOCUMENT_MAX_PENDING_PER_USER: ${DOCUMENT_MAX_PENDING_PER_USER:-20}
      DOCUMENT_PENDING_RETENTION_HOURS: ${DOCUMENT_PENDING_RETENTION_HOURS:-24}
      DOCUMENT_QUARANTINE_RETENTION_DAYS: ${DOCUMENT_QUARANTINE_RETENTION_DAYS:-7}
      DOCUMENT_DELETION_RETENTION_DAYS: ${DOCUMENT_DELETION_RETENTION_DAYS:-30}
      DOCUMENT_SCAN_STALE_MINUTES: ${DOCUMENT_SCAN_STALE_MINUTES:-15}
      DOCUMENT_MAINTENANCE_INTERVAL_SECONDS: ${DOCUMENT_MAINTENANCE_INTERVAL_SECONDS:-3600}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-120}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: ./backend
      target: dev
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-cache:/root/.cache/uv
    restart: "no"

  # ---------------- Backend (FastAPI) ----------------
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # In development, migrations are an explicit operator/test step. This
      # prevents a hot-reload from applying a draft revision to live data.
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SUPPLIER_DATA_ENCRYPTION_KEY: ${SUPPLIER_DATA_ENCRYPTION_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
      REFRESH_RATE_LIMIT: ${REFRESH_RATE_LIMIT:-30/minute}
      RESET_RATE_LIMIT: ${RESET_RATE_LIMIT:-5/minute}
      # Local development runs over http://localhost, so Secure cookies would
      # never be sent and refresh-token rotation would fail after 15 minutes.
      # Production overrides this to true in compose.prod.yaml.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-erp-system}
      MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES:-10485760}
      MEDIA_SIGNATURE_TTL_SECONDS: ${MEDIA_SIGNATURE_TTL_SECONDS:-300}
      <<: *document-storage-environment
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-cache:/root/.cache/uv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  document-maintenance:
    build:
      context: ./backend
      target: dev
    command: ["python", "-m", "app.infrastructure.document_maintenance"]
    environment:
      <<: *document-storage-environment
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-cache:/root/.cache/uv
    restart: unless-stopped

  # ---------------- One-shot database bootstrap ----------------
  # Runs after Alembic finishes. A durable app_meta marker makes ordinary
  # restarts no-ops, preserving records intentionally sent to the trash.
  seed:
    build:
      context: ./backend
      target: dev
    command:
      - sh
      - -c
      - >-
        if [ "$$AUTO_SEED" = "true" ]; then
          python -m seed.seed_data;
        else
          echo "[seed] Automatic seed disabled.";
        fi
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      AUTO_SEED: ${AUTO_SEED:-true}
      FORCE_SEED: ${FORCE_SEED:-false}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@erp-system.dev}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-cache:/root/.cache/uv
    restart: "no"

  # ---------------- Frontend (SvelteKit dev) ----------------
  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        PUBLIC_GOOGLE_MAPS_API_KEY: ${PUBLIC_GOOGLE_MAPS_API_KEY:-}
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      PUBLIC_APP_NAME: ${PUBLIC_APP_NAME:-ERP System}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      PUBLIC_GOOGLE_MAPS_API_KEY: ${PUBLIC_GOOGLE_MAPS_API_KEY:-}
      ORIGIN: http://localhost:5173
    depends_on:
      backend:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    restart: unless-stopped

  # ---------------- Redis (optional, used from phase 1+) ----------------
  redis:
    profiles: [redis]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------- Security Scanners (optional, profile: security) ----------------
  security-zap:
    profiles: [security]
    image: ghcr.io/zaproxy/zaproxy:stable
    command: zap-baseline.py -t http://backend:8000 -J security-report.json -r security-report.html -I
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./reports:/zap/wrk/:rw

  security-trivy:
    profiles: [security, security-deep]
    image: aquasec/trivy:latest
    command: fs --format json --output /reports/trivy-report.json /src
    volumes:
      - .:/src:ro
      - ./reports:/reports:rw

  security-zap-deep:
    profiles: [security-deep]
    image: ghcr.io/zaproxy/zaproxy:stable
    command: zap-api-scan.py -t http://backend:8000/openapi.json -f openapi -J security-deep-report.json -r security-deep-report.html
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./reports:/zap/wrk/:rw

volumes:
  pgdata:
  rustfs-data:
  rustfs-logs:
  clamav-db:
  redis-data:
  backend-cache:
  frontend-node-modules:
