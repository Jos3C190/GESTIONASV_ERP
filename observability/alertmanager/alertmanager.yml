route:
  receiver: local-ui
  group_by: [alertname, severity]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: local-ui
      matchers: [severity="critical"]
      repeat_interval: 1h

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname]

receivers:
  - name: local-ui
