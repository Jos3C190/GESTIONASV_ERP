# Render Infrastructure as Code (IaC) — Blueprint
# Docs: https://docs.render.com/infrastructure-as-code
#
# Deploy: connect your GitHub repo to Render and it will auto-detect this file.
# All sensitive env vars (DATABASE_URL, JWT_SECRET_KEY, etc.) must be set
# manually in the Render dashboard — they are NOT stored here.

services:
  - type: web
    name: erp-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /health/live
    envVars:
      # --- Database (Supabase) ---
      - key: DATABASE_URL
        sync: false  # Set manually in dashboard
      - key: DATABASE_URL_SYNC
        sync: false
      # --- App ---
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: WARNING
      - key: BACKEND_WORKERS
        value: "2"
      # --- Auth ---
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # --- Security ---
      - key: ARGON2_TIME_COST
        value: "3"
      - key: ARGON2_MEMORY_COST
        value: "65536"
      - key: ARGON2_PARALLELISM
        value: "4"
      - key: SECURE_COOKIES
        value: "true"
      - key: LOGIN_RATE_LIMIT
        value: 10/minute
      - key: REFRESH_RATE_LIMIT
        value: 30/minute
      - key: RESET_RATE_LIMIT
        value: 5/minute
      # --- CORS (set your Vercel URL here) ---
      - key: CORS_ORIGINS
        sync: false
      # --- Cloudinary ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: erp-mini
